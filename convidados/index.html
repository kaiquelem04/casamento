<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de convidados · Kaique & Maê</title>
  <!-- Página só dos noivos: pede aos buscadores para não indexar -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#613032">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&display=swap">
  <style>
    /* Mesma paleta e fontes do site e do convite */
    :root {
      --vinho: #613032;
      --vinho-profundo: #4d2527;
      --papel: #eeebe6;
      --branco: #ffffff;
      --branco-suave: rgba(255, 255, 255, 0.84);
      --vinho-suave: rgba(97, 48, 50, 0.78);
      --fio-claro: rgba(255, 255, 255, 0.42);
      --fio-vinho: rgba(97, 48, 50, 0.28);
      --linha: rgba(97, 48, 50, 0.12);

      --script: "Pinyon Script", "Segoe Script", cursive;
      --texto: "Cormorant Garamond", "Cormorant", Garamond, Georgia, serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--papel);
      color: var(--vinho);
      font-family: var(--texto);
      font-weight: 500;
      font-size: clamp(17.5px, 0.6vw + 15px, 20px);
      line-height: 1.6;
      letter-spacing: 0.01em;
      -webkit-text-size-adjust: 100%;
    }
    p { margin: 0; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.22em; }
    :focus-visible { outline: 1.5px solid currentColor; outline-offset: 4px; border-radius: 2px; }
    .visualmente-oculto {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- Topo com as flores do convite ---------- */
    .topo {
      position: relative;
      overflow: clip;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: clamp(250px, 30vw, 340px);
      padding: 48px clamp(64px, 14vw, 180px);
      background: var(--vinho);
      color: var(--branco);
      text-align: center;
    }
    .topo-conteudo { position: relative; z-index: 1; }
    .topo-sobre { margin-bottom: 6px; font-style: italic; letter-spacing: 0.06em; color: var(--branco-suave); }
    .topo-sobre a { text-decoration-color: var(--fio-claro); }
    .topo-sobre a:hover { text-decoration-color: var(--branco); }
    h1 {
      margin: 0;
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(46px, 7vw, 84px);
      line-height: 1.1;
      text-wrap: balance;
    }

    .flores {
      position: absolute;
      top: 0;
      bottom: 0;
      aspect-ratio: 397 / 559;
      container-type: size;
      pointer-events: none;
    }
    .flores-esq { left: 0; }
    .flores-dir { right: 0; }
    .flor {
      --u: calc(100cqh / 559);
      position: absolute;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }
    .flor-topo { width: calc(var(--u) * 204.94); aspect-ratio: 620 / 956;  background-image: url("../img/flor-topo.webp"); }
    .flor-base { width: calc(var(--u) * 205.21); aspect-ratio: 620 / 1026; background-image: url("../img/flor-base.webp"); }
    .flores-esq .flor-topo { left: calc(var(--u) * -96.93);  top: calc(var(--u) * 4.32);   transform: rotate(12.73deg); }
    .flores-esq .flor-base { left: calc(var(--u) * -104.99); top: calc(var(--u) * 250.59); }
    .flores-dir .flor-topo { left: calc(var(--u) * 279.77);  top: calc(var(--u) * 11.33);  transform: rotate(-2.69deg) scaleX(-1); }
    .flores-dir .flor-base { left: calc(var(--u) * 272.46);  top: calc(var(--u) * 251.58); transform: scaleX(-1); }

    /* ---------- Miolo ---------- */
    .miolo {
      max-width: 1120px;
      margin: 0 auto;
      padding: clamp(40px, 6vw, 72px) 16px clamp(56px, 8vw, 96px);
    }

    /* ---------- Contador (também filtra as listas) ---------- */
    .contador { text-align: center; }
    .contador-numeros {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 22rem;
      margin: 0 auto;
    }
    @media (min-width: 600px) {
      .contador-numeros { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 44rem; }
    }
    .unidade {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      padding: 10px 6px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--vinho);
      font: inherit;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    /* fio entre os números */
    .unidade:nth-child(even)::before,
    .unidade + .unidade::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18%;
      bottom: 22%;
      width: 1px;
      background: var(--fio-vinho);
    }
    @media (max-width: 599px) { .unidade:nth-child(3)::before { display: none; } }
    .unidade:hover { background: rgba(97, 48, 50, 0.06); }
    .unidade::after {
      content: "";
      position: absolute;
      left: 26%;
      right: 26%;
      bottom: 2px;
      height: 1.5px;
      background: var(--vinho);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .unidade[aria-pressed="true"]::after { opacity: 1; }
    .num {
      font-size: clamp(44px, 9vw, 74px);
      font-weight: 500;
      line-height: 1;
      font-variant-numeric: lining-nums tabular-nums;
    }
    .rotulo { margin-top: 8px; font-style: italic; font-size: 0.9em; line-height: 1.2; color: var(--vinho-suave); }

    .barra {
      max-width: 30rem;
      height: 4px;
      margin: 22px auto 0;
      border-radius: 999px;
      background: var(--fio-vinho);
      overflow: hidden;
    }
    .barra-cheia {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--vinho);
      transition: width 0.6s ease;
    }
    .contador-nota { margin-top: 10px; font-style: italic; color: var(--vinho-suave); }
    .meia {
      display: inline-block;
      margin-top: 14px;
      padding: 0.45em 1.3em;
      border: 1px solid var(--fio-vinho);
      border-radius: 999px;
      line-height: 1.4;
      text-wrap: balance;
    }
    .meia strong { font-weight: 600; font-variant-numeric: lining-nums; }

    /* ---------- Busca ---------- */
    .campo {
      width: 100%;
      padding: 0.6em 1.15em;
      border: 1px solid var(--fio-vinho);
      border-radius: 999px;
      background: var(--branco);
      color: var(--vinho);
      font: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .campo::placeholder { font-style: italic; color: var(--vinho-suave); opacity: 1; }
    .campo:hover, .campo:focus { border-color: var(--vinho); }
    .campo:focus { outline: none; box-shadow: 0 0 0 3px rgba(97, 48, 50, 0.12); }
    .busca { max-width: 34rem; margin: clamp(30px, 4.4vw, 42px) auto 0; }

    /* ---------- As duas listas ---------- */
    .listas {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(36px, 5vw, 48px) 28px;
      margin-top: clamp(28px, 4vw, 40px);
    }
    @media (min-width: 880px) {
      .listas { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    }
    .lado-topo { margin-bottom: 12px; text-align: center; }
    .lado h2 {
      margin: 0;
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(36px, 4.4vw, 50px);
      line-height: 1.15;
    }
    .lado-resumo { font-style: italic; color: var(--vinho-suave); }

    .lista {
      list-style: none;
      margin: 0;
      padding: 4px 0;
      border: 1px solid var(--linha);
      border-radius: 6px 6px 0 0;
      background: var(--branco);
    }
    .convidado {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 10px;
      border-bottom: 1px solid var(--linha);
    }
    .convidado:last-child { border-bottom: 0; }
    .pos {
      flex: none;
      width: 2ch;
      font-size: 0.8em;
      text-align: right;
      color: var(--vinho-suave);
      font-variant-numeric: lining-nums tabular-nums;
    }
    .marca {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      min-height: 50px;
      padding: 8px 6px 8px 8px;
      cursor: pointer;
    }
    .caixa {
      appearance: none;
      -webkit-appearance: none;
      flex: none;
      display: grid;
      place-content: center;
      width: 22px;
      height: 22px;
      margin: 0;
      border: 1.5px solid var(--vinho);
      border-radius: 50%;
      background: var(--branco);
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .caixa::before {
      content: "";
      width: 10px;
      height: 5px;
      border-left: 2px solid var(--branco);
      border-bottom: 2px solid var(--branco);
      transform: translateY(-1px) rotate(-45deg);
      opacity: 0;
    }
    .caixa:checked { background: var(--vinho); }
    .caixa:checked::before { opacity: 1; }
    .marca:hover .caixa:not(:checked) { background: rgba(97, 48, 50, 0.08); }
    .nome { line-height: 1.3; overflow-wrap: anywhere; }
    .convidado:not(.sim) .nome { color: var(--vinho-suave); }

    /* segundo check: criança */
    .tag {
      flex: none;
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 0.12em 0.75em 0.18em;
      border: 1px solid var(--fio-vinho);
      border-radius: 999px;
      font-size: 0.8em;
      font-style: italic;
      line-height: 1.3;
      color: var(--vinho-suave);
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.15s, background-color 0.15s, color 0.15s;
    }
    .tag input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
    .tag:hover, .tag:focus-within { opacity: 1; }
    .tag:focus-within { outline: 1.5px solid var(--vinho); outline-offset: 2px; }
    .kid .tag { opacity: 1; border-color: var(--vinho); background: var(--vinho); color: var(--branco); font-style: normal; }

    .remover {
      flex: none;
      width: 38px;
      height: 38px;
      margin-right: 4px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--vinho-suave);
      font: inherit;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.6;
    }
    .remover:hover, .remover:focus-visible { opacity: 1; background: rgba(97, 48, 50, 0.08); color: var(--vinho); }

    .vazio {
      padding: 22px 16px;
      border: 1px solid var(--linha);
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      background: var(--branco);
      font-style: italic;
      text-align: center;
      color: var(--vinho-suave);
    }

    /* adicionar convidado, colado no fim de cada lista */
    .novo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--linha);
      border-top: 1px dashed var(--fio-vinho);
      border-radius: 0 0 6px 6px;
      background: rgba(255, 255, 255, 0.55);
    }
    .novo .campo { flex: 1 1 12rem; min-width: 0; padding: 0.5em 1em; }
    .novo .tag { opacity: 0.8; font-size: 0.85em; padding: 0.3em 0.9em 0.35em; }
    .novo .tag:has(input:checked) { opacity: 1; border-color: var(--vinho); background: var(--vinho); color: var(--branco); font-style: normal; }

    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5em 1.4em;
      border: 1px solid var(--vinho);
      border-radius: 999px;
      background: var(--vinho);
      color: var(--branco);
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .botao:hover { background: var(--vinho-profundo); }

    /* ---------- Rodapé ---------- */
    .rodape {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: clamp(48px, 7vw, 72px) 22px;
      background: var(--vinho);
      color: var(--branco);
      text-align: center;
    }
    .rodape-nomes { font-family: var(--script); font-size: clamp(40px, 4.6vw, 54px); line-height: 1.2; }
    .rodape-texto { max-width: 34ch; font-style: italic; color: var(--branco-suave); }
    .rodape-link { margin-top: 6px; font-style: italic; color: var(--branco-suave); text-decoration-color: var(--fio-claro); }
    .rodape-link:hover { color: var(--branco); text-decoration-color: var(--branco); }

    /* ---------- Aviso de salvamento ---------- */
    .aviso {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 10;
      max-width: calc(100vw - 32px);
      padding: 0.5em 1.3em;
      border-radius: 999px;
      background: var(--vinho-profundo);
      color: var(--branco);
      font-style: italic;
      text-align: center;
      box-shadow: 0 14px 40px -12px rgba(40, 16, 18, 0.55);
      transform: translateX(-50%);
    }
    .aviso.erro { border: 1px solid var(--vinho); border-radius: 14px; background: var(--branco); color: var(--vinho); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <header class="topo">
    <div class="flores flores-esq" aria-hidden="true">
      <div class="flor flor-topo"></div>
      <div class="flor flor-base"></div>
    </div>
    <div class="flores flores-dir" aria-hidden="true">
      <div class="flor flor-topo"></div>
      <div class="flor flor-base"></div>
    </div>
    <div class="topo-conteudo">
      <p class="topo-sobre"><a href="../">Kaique &amp; Maê</a> · 09 · 01 · 2027</p>
      <h1>Lista de convidados</h1>
    </div>
  </header>

  <main>
    <div class="miolo">

      <!-- Contador: os números também filtram as listas -->
      <section class="contador" aria-labelledby="t-contador">
        <h2 class="visualmente-oculto" id="t-contador">Contador de convidados</h2>
        <div class="contador-numeros" role="group" aria-label="Filtrar as listas">
          <button class="unidade" type="button" data-filtro="confirmados" aria-pressed="false">
            <span class="num" id="n-confirmados">–</span><span class="rotulo">confirmados</span>
          </button>
          <button class="unidade" type="button" data-filtro="pendentes" aria-pressed="false">
            <span class="num" id="n-pendentes">–</span><span class="rotulo">pendentes</span>
          </button>
          <button class="unidade" type="button" data-filtro="criancas" aria-pressed="false">
            <span class="num" id="n-criancas">–</span><span class="rotulo">crianças</span>
          </button>
          <button class="unidade" type="button" data-filtro="todos" aria-pressed="true">
            <span class="num" id="n-total">–</span><span class="rotulo">no total</span>
          </button>
        </div>
        <div class="barra" aria-hidden="true"><span class="barra-cheia" id="barra"></span></div>
        <p class="contador-nota" id="nota" role="status">Carregando a lista…</p>
        <p class="meia" id="meia" hidden></p>
      </section>

      <div class="busca">
        <label class="visualmente-oculto" for="busca">Buscar convidado</label>
        <input class="campo" id="busca" type="search" placeholder="Buscar convidado" autocomplete="off" spellcheck="false">
      </div>

      <div class="listas">
        <section class="lado" data-lista="Kaique" aria-labelledby="t-kaique">
          <header class="lado-topo">
            <h2 id="t-kaique">Convidados do Kaique</h2>
            <p class="lado-resumo" data-resumo></p>
          </header>
          <ol class="lista" data-itens></ol>
          <p class="vazio" data-vazio hidden></p>
          <form class="novo" data-novo>
            <label class="visualmente-oculto" for="novo-kaique">Nome do novo convidado do Kaique</label>
            <input class="campo" id="novo-kaique" maxlength="80" placeholder="Adicionar convidado" autocomplete="off" required>
            <label class="tag"><input type="checkbox" data-novo-crianca>criança</label>
            <button class="botao" type="submit">Adicionar</button>
          </form>
        </section>

        <section class="lado" data-lista="Maê" aria-labelledby="t-mae">
          <header class="lado-topo">
            <h2 id="t-mae">Convidados da Maê</h2>
            <p class="lado-resumo" data-resumo></p>
          </header>
          <ol class="lista" data-itens></ol>
          <p class="vazio" data-vazio hidden></p>
          <form class="novo" data-novo>
            <label class="visualmente-oculto" for="novo-mae">Nome do novo convidado da Maê</label>
            <input class="campo" id="novo-mae" maxlength="80" placeholder="Adicionar convidado" autocomplete="off" required>
            <label class="tag"><input type="checkbox" data-novo-crianca>criança</label>
            <button class="botao" type="submit">Adicionar</button>
          </form>
        </section>
      </div>
      <noscript><p class="contador-nota">Ative o JavaScript do navegador para ver a lista.</p></noscript>

    </div>
  </main>

  <footer class="rodape">
    <p class="rodape-nomes">Kaique &amp; Maê</p>
    <p class="rodape-texto">Tudo o que vocês marcam aqui é salvo na hora na planilha da lista.</p>
    <a class="rodape-link" href="../">Ver o site do casamento</a>
  </footer>

  <p class="aviso" id="aviso" role="status" aria-live="polite" hidden></p>

  <script>
    // =========================================================
    // A lista fica numa planilha do Google; o script da planilha
    // (convidados/planilha.gs) responde neste endereço.
    // =========================================================
    const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbzE-4T8pi51u4I3YMBzHeU4QJc81sbI7hPtWt8xT-9G0jwKrpnCtz6wXXrLA2f6Fwdj/exec";

    // para testar no computador: ?api=http://localhost:PORTA
    const parametros = new URLSearchParams(location.search);
    const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
    const API = (LOCAL && parametros.get("api")) || URL_PLANILHA;
    const LISTAS = ["Kaique", "Maê"];

    const $ = (id) => document.getElementById(id);
    const el = {
      confirmados: $("n-confirmados"), pendentes: $("n-pendentes"), criancas: $("n-criancas"), total: $("n-total"),
      barra: $("barra"), nota: $("nota"), meia: $("meia"), busca: $("busca"), aviso: $("aviso"),
    };
    const lados = Object.fromEntries([...document.querySelectorAll(".lado")].map((s) => [s.dataset.lista, {
      secao: s,
      itens: s.querySelector("[data-itens]"),
      resumo: s.querySelector("[data-resumo]"),
      vazio: s.querySelector("[data-vazio]"),
      form: s.querySelector("[data-novo]"),
    }]));

    // ---------- estado ----------
    let convidados = [];       // na ordem da planilha
    let filtro = "todos";
    let carregadoEm = 0;
    let pendentes = 0;         // mudanças esperando resposta da planilha
    let fila = Promise.resolve();

    // ---------- utilidades ----------
    const semAcento = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
    const limparNome = (t) => t.replace(/\s+/g, " ").trim();
    const numero = (n) => n.toLocaleString("pt-BR", { maximumFractionDigits: 1 });
    const meia = (grupo) => grupo.reduce((s, c) => s + (c.crianca ? 0.5 : 1), 0);
    const doLado = (lista) => (lista === "Kaique" ? "do Kaique" : "da Maê");
    function novoId() {
      const n = new Uint8Array(4);
      crypto.getRandomValues(n);
      return [...n].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    function validar(lista) {
      if (!Array.isArray(lista)) throw new Error("resposta inválida da planilha");
      return lista
        .filter((c) => c && typeof c.nome === "string" && c.id)
        .map((c) => ({
          id: String(c.id),
          lista: LISTAS.includes(c.lista) ? c.lista : "Maê",
          nome: limparNome(c.nome),
          confirmado: c.confirmado === true,
          crianca: c.crianca === true,
        }));
    }
    const mesmaLista = (a, b) => JSON.stringify(a) === JSON.stringify(b);

    // ---------- conversa com a planilha ----------
    // sem cabeçalhos especiais, para o navegador não barrar o pedido (CORS)
    async function pedir(op) {
      if (!API) throw new Error("planilha não configurada");
      const r = op
        ? await fetch(API, { method: "POST", body: JSON.stringify(op), headers: { "Content-Type": "text/plain;charset=utf-8" } })
        : await fetch(`${API}?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) throw new Error("a planilha respondeu " + r.status);
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || "erro na planilha");
      return validar(j.convidados);
    }

    async function carregar({ silencioso = false } = {}) {
      try {
        const lista = await pedir();
        if (pendentes) return;              // chegou mudança no meio do caminho: não sobrescreve
        const mudou = !mesmaLista(lista, convidados);
        convidados = lista;
        carregadoEm = Date.now();
        if (mudou || !silencioso) renderizar();
      } catch (erro) {
        if (!silencioso || !convidados.length) {
          el.nota.textContent = "Não foi possível carregar a lista. Confira a internet e recarregue a página.";
        }
      }
    }

    // mudanças vão uma de cada vez; a tela já mostra o resultado antes
    function salvar(op) {
      pendentes++;
      mostrarAviso("Salvando…");
      fila = fila
        .then(() => pedir(op))
        .then((lista) => {
          pendentes--;
          if (!pendentes) {
            const mudou = !mesmaLista(lista, convidados);   // a outra pessoa mexeu enquanto isso
            convidados = lista;
            carregadoEm = Date.now();
            if (mudou) renderizar();
            mostrarAviso("Salvo", "ok", 1600);
          }
        })
        .catch(async (erro) => {
          pendentes--;
          const semRede = erro instanceof TypeError;
          mostrarAviso(semRede ? "Sem conexão. A última mudança não foi salva." : "Não foi possível salvar a última mudança. Tente de novo.", "erro", 7000);
          if (!pendentes) await carregar();
        });
    }

    // ---------- tela ----------
    function atualizarContador() {
      const total = convidados.length;
      const conf = convidados.filter((c) => c.confirmado);
      const kids = convidados.filter((c) => c.crianca);
      el.confirmados.textContent = conf.length;
      el.pendentes.textContent = total - conf.length;
      el.criancas.textContent = kids.length;
      el.total.textContent = total;
      const pct = total ? Math.round((conf.length / total) * 100) : 0;
      el.barra.style.width = pct + "%";
      el.nota.textContent = total ? `${pct}% da lista já confirmou` : "A lista está vazia.";
      el.meia.hidden = !total;
      el.meia.innerHTML = "";
      el.meia.append(
        "Criança conta meia: ",
        Object.assign(document.createElement("strong"), { textContent: numero(meia(conf)) }),
        " confirmados de ",
        Object.assign(document.createElement("strong"), { textContent: numero(meia(convidados)) }),
      );
      for (const lista of LISTAS) {
        const g = convidados.filter((c) => c.lista === lista);
        const k = g.filter((c) => c.crianca).length;
        lados[lista].resumo.textContent = g.length
          ? `${g.filter((c) => c.confirmado).length} de ${g.length} confirmados` + (k ? ` · ${k} ${k === 1 ? "criança" : "crianças"}` : "")
          : "Ninguém ainda";
      }
    }

    function passaNoFiltro(c, termo) {
      if (filtro === "confirmados" && !c.confirmado) return false;
      if (filtro === "pendentes" && c.confirmado) return false;
      if (filtro === "criancas" && !c.crianca) return false;
      return !termo || semAcento(c.nome).includes(termo);
    }

    function linha(c, posicao) {
      const li = document.createElement("li");
      li.className = "convidado" + (c.confirmado ? " sim" : "") + (c.crianca ? " kid" : "");
      li.dataset.id = c.id;

      const pos = document.createElement("span");
      pos.className = "pos";
      pos.setAttribute("aria-hidden", "true");
      pos.textContent = posicao;

      const marca = document.createElement("label");
      marca.className = "marca";
      const caixa = document.createElement("input");
      caixa.type = "checkbox";
      caixa.className = "caixa";
      caixa.checked = c.confirmado;
      caixa.dataset.acao = "marcar";
      const nome = document.createElement("span");
      nome.className = "nome";
      nome.textContent = c.nome;
      marca.append(caixa, nome);

      const tag = document.createElement("label");
      tag.className = "tag";
      const kid = document.createElement("input");
      kid.type = "checkbox";
      kid.checked = c.crianca;
      kid.dataset.acao = "crianca";
      kid.setAttribute("aria-label", `${c.nome} é criança`);
      tag.append(kid, "criança");

      const remover = document.createElement("button");
      remover.type = "button";
      remover.className = "remover";
      remover.dataset.acao = "remover";
      remover.setAttribute("aria-label", "Remover " + c.nome);
      remover.textContent = "×";

      li.append(pos, marca, tag, remover);
      return li;
    }

    function renderizar() {
      atualizarContador();
      const termo = semAcento(el.busca.value);
      for (const lista of LISTAS) {
        const lado = lados[lista];
        const doGrupo = convidados.filter((c) => c.lista === lista);
        const frag = document.createDocumentFragment();
        doGrupo.forEach((c, i) => { if (passaNoFiltro(c, termo)) frag.append(linha(c, i + 1)); });
        const qtd = frag.childNodes.length;
        lado.itens.replaceChildren(frag);
        lado.itens.hidden = !qtd;
        lado.vazio.hidden = !!qtd;
        if (!qtd) {
          lado.vazio.textContent = !doGrupo.length ? "Ninguém nesta lista ainda."
            : termo ? `Ninguém com “${el.busca.value.trim()}” aqui.`
            : filtro === "confirmados" ? "Ninguém confirmou ainda."
            : filtro === "criancas" ? "Nenhuma criança nesta lista."
            : "Todo mundo já confirmou!";
        }
      }
    }

    let timerAviso;
    function mostrarAviso(texto, tipo = "ok", duracao = 0) {
      clearTimeout(timerAviso);
      el.aviso.textContent = texto;
      el.aviso.classList.toggle("erro", tipo === "erro");
      el.aviso.hidden = false;
      if (duracao) timerAviso = setTimeout(() => { el.aviso.hidden = true; }, duracao);
    }

    // ---------- interações ----------
    document.querySelectorAll("[data-filtro]").forEach((botao) => {
      botao.addEventListener("click", () => {
        filtro = botao.dataset.filtro;
        document.querySelectorAll("[data-filtro]").forEach((b) => b.setAttribute("aria-pressed", String(b === botao)));
        renderizar();
      });
    });
    el.busca.addEventListener("input", renderizar);

    for (const lista of LISTAS) {
      const lado = lados[lista];

      // marcar presença ou criança: muda na hora, sem reordenar a tela
      lado.itens.addEventListener("change", (e) => {
        const caixa = e.target;
        const li = caixa.closest(".convidado");
        if (!li || !caixa.dataset.acao) return;
        const c = convidados.find((x) => x.id === li.dataset.id);
        if (!c) return;
        const valor = caixa.checked;
        const campo = caixa.dataset.acao === "marcar" ? "confirmado" : "crianca";
        convidados = convidados.map((x) => (x.id === c.id ? { ...x, [campo]: valor } : x));
        li.classList.toggle(campo === "confirmado" ? "sim" : "kid", valor);
        atualizarContador();
        salvar({ tipo: caixa.dataset.acao, id: c.id, valor });
      });

      lado.itens.addEventListener("click", (e) => {
        const botao = e.target.closest('[data-acao="remover"]');
        if (!botao) return;
        const c = convidados.find((x) => x.id === botao.closest(".convidado").dataset.id);
        if (!c || !confirm(`Remover ${c.nome} da lista ${doLado(c.lista)}?`)) return;
        convidados = convidados.filter((x) => x.id !== c.id);
        renderizar();
        salvar({ tipo: "remover", id: c.id });
      });

      lado.form.addEventListener("submit", (e) => {
        e.preventDefault();
        const campo = lado.form.querySelector(".campo");
        const kid = lado.form.querySelector("[data-novo-crianca]");
        const nome = limparNome(campo.value);
        if (!nome) return;
        const repetido = convidados.find((c) => semAcento(c.nome) === semAcento(nome));
        if (repetido && !confirm(`Já tem “${repetido.nome}” na lista ${doLado(repetido.lista)}. Adicionar outra pessoa com esse nome?`)) return;
        const novo = { id: novoId(), lista, nome, confirmado: false, crianca: kid.checked };
        // entra no fim da lista dela
        const ultimo = convidados.map((c) => c.lista).lastIndexOf(lista);
        convidados = [...convidados.slice(0, ultimo + 1), novo, ...convidados.slice(ultimo + 1)];
        campo.value = "";
        kid.checked = false;
        if (filtro !== "todos" && filtro !== "pendentes" && !(filtro === "criancas" && novo.crianca)) {
          // volta para "todos" para a pessoa ver quem acabou de entrar
          document.querySelector('[data-filtro="todos"]').click();
        } else {
          renderizar();
        }
        campo.focus();
        salvar({ tipo: "adicionar", id: novo.id, lista, nome, crianca: novo.crianca });
      });
    }

    // traz o que a outra pessoa marcou: ao voltar para a aba e de tempos em tempos
    function talvezAtualizar(intervalo) {
      if (document.visibilityState === "visible" && !pendentes && Date.now() - carregadoEm > intervalo) {
        carregar({ silencioso: true });
      }
    }
    document.addEventListener("visibilitychange", () => talvezAtualizar(10000));
    setInterval(() => talvezAtualizar(40000), 45000);

    // avisa antes de fechar se ainda tem mudança salvando
    window.addEventListener("beforeunload", (e) => { if (pendentes) e.preventDefault(); });

    carregar();
  </script>
</body>
</html>
